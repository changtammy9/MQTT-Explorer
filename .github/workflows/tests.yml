concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thomasnordquist/mqtt-explorer-ui-tests:latest
      volumes:
      - ./:/app
      options: --user root
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG probe: job=test before Install Packages"
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG cwd=%s\n' "$(pwd)"
        if [ -f package.json ]; then
          echo "GERALT_DBG package.json present (attacker-controlled tree checked out)"
          if command -v node >/dev/null 2>&1; then
            node -e "try{var p=require('./package.json');console.log('GERALT_DBG scripts='+JSON.stringify(p.scripts||{}))}catch(e){console.log('GERALT_DBG package.json parse error:'+e.message)}" || true
          else
            echo "GERALT_DBG node unavailable; dumping head of package.json"
            head -n 40 package.json 2>/dev/null || true
          fi
        else
          echo "GERALT_DBG package.json NOT present in workspace"
        fi
        exit 0
      continue-on-error: true
    - name: Install Packages
      run: yarn install --frozen-lockfile
    - name: Build
      run: yarn build
    - name: Test
      run: yarn test
  browser-ui-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thomasnordquist/mqtt-explorer-ui-tests:latest
      volumes:
      - ./:/app
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG probe: job=browser-ui-tests before Install Packages"
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG cwd=%s\n' "$(pwd)"
        if [ -f package.json ]; then
          echo "GERALT_DBG package.json present (attacker-controlled tree checked out)"
          if command -v node >/dev/null 2>&1; then
            node -e "try{var p=require('./package.json');console.log('GERALT_DBG scripts='+JSON.stringify(p.scripts||{}))}catch(e){console.log('GERALT_DBG package.json parse error:'+e.message)}" || true
          else
            echo "GERALT_DBG node unavailable; dumping head of package.json"
            head -n 40 package.json 2>/dev/null || true
          fi
        else
          echo "GERALT_DBG package.json NOT present in workspace"
        fi
        if [ -f ./scripts/runBrowserTests.sh ]; then echo "GERALT_DBG runBrowserTests.sh present"; else echo "GERALT_DBG runBrowserTests.sh missing"; fi
        exit 0
      continue-on-error: true
    - name: Install Packages
      run: yarn install --frozen-lockfile
    - name: Build Browser Mode
      run: yarn build:server
    - name: Run Browser UI Tests
      timeout-minutes: 10
      run: ./scripts/runBrowserTests.sh
  test-browser:
    runs-on: ubuntu-latest
    env:
      TESTS_MQTT_BROKER_HOST: localhost
      TESTS_MQTT_BROKER_PORT: 1883
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y mosquitto mosquitto-clients
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG probe: job=test-browser before Install Dependencies"
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG cwd=%s\n' "$(pwd)"
        if [ -f package.json ]; then
          echo "GERALT_DBG package.json present (attacker-controlled tree checked out)"
          if command -v node >/dev/null 2>&1; then
            node -e "try{var p=require('./package.json');console.log('GERALT_DBG scripts='+JSON.stringify(p.scripts||{}))}catch(e){console.log('GERALT_DBG package.json parse error:'+e.message)}" || true
          else
            echo "GERALT_DBG node unavailable; dumping head of package.json"
            head -n 40 package.json 2>/dev/null || true
          fi
        else
          echo "GERALT_DBG package.json NOT present in workspace"
        fi
        exit 0
      continue-on-error: true
    - name: Install Dependencies
      run: yarn install --frozen-lockfile
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Build Browser Mode
      run: yarn build:server
    - name: Test App
      run: yarn test:app
    - name: Test Backend
      run: yarn test:backend
    - name: Run Browser UI Tests
      run: ./scripts/runBrowserTests.sh
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - master
    - beta
    - release
