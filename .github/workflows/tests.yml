concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  demo-video:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thomasnordquist/mqtt-explorer-ui-tests:latest
      volumes:
      - ./:/app
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Generate unique base path
      id: basepath
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BASEPATH="pr-${{ github.event.pull_request.number }}-${TIMESTAMP}"
        echo "basepath=${BASEPATH}" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG demo-video pre-configure-aws"
        if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then echo "pre AWS_ACCESS_KEY_ID present len=${#AWS_ACCESS_KEY_ID}"; else echo "pre AWS_ACCESS_KEY_ID absent"; fi
        if [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then echo "pre AWS_SECRET_ACCESS_KEY present len=${#AWS_SECRET_ACCESS_KEY}"; else echo "pre AWS_SECRET_ACCESS_KEY absent"; fi
        echo "AWS_REGION=${AWS_REGION:-<unset>}"
      continue-on-error: true
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ vars.AWS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1
    - name: Generate file URLs
      id: fileurl
      env:
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        BASEPATH: ${{ steps.basepath.outputs.basepath }}
      run: |
        BASE_URL="https://${AWS_BUCKET}.s3.eu-central-1.amazonaws.com/artifacts/${BASEPATH}"
        echo "base-url=${BASE_URL}" >> $GITHUB_OUTPUT
        echo "Uploaded to: ${BASE_URL}"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG demo-video pre-sink"
        if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then echo "AWS_ACCESS_KEY_ID present len=${#AWS_ACCESS_KEY_ID}"; else echo "AWS_ACCESS_KEY_ID absent"; fi
        if [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then echo "AWS_SECRET_ACCESS_KEY present len=${#AWS_SECRET_ACCESS_KEY}"; else echo "AWS_SECRET_ACCESS_KEY absent"; fi
        if [ -n "${AWS_SESSION_TOKEN:-}" ]; then echo "AWS_SESSION_TOKEN present"; else echo "AWS_SESSION_TOKEN absent"; fi
        echo "AWS_REGION=${AWS_REGION:-<unset>}"
        if [ -f ./scripts/generateMarkdownSummary.js ]; then echo "sink script present"; else echo "sink script MISSING"; fi
        if command -v node >/dev/null 2>&1; then echo "node present: $(node --version 2>/dev/null || echo unknown)"; else echo "node MISSING"; fi
      continue-on-error: true
    - name: Generate markdown summary
      id: markdown
      env:
        BASE_URL: ${{ steps.fileurl.outputs.base-url }}
      run: |
        MARKDOWN=$(node ./scripts/generateMarkdownSummary.js "${BASE_URL}")
        echo "markdown<<EOF" >> $GITHUB_OUTPUT
        echo "$MARKDOWN" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
  demo-video-mobile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thomasnordquist/mqtt-explorer-ui-tests:latest
      volumes:
      - ./:/app
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Generate unique base path
      id: basepath
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BASEPATH="pr-${{ github.event.pull_request.number }}-mobile-${TIMESTAMP}"
        echo "basepath=${BASEPATH}" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG demo-video-mobile pre-configure-aws"
        if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then echo "pre AWS_ACCESS_KEY_ID present len=${#AWS_ACCESS_KEY_ID}"; else echo "pre AWS_ACCESS_KEY_ID absent"; fi
        if [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then echo "pre AWS_SECRET_ACCESS_KEY present len=${#AWS_SECRET_ACCESS_KEY}"; else echo "pre AWS_SECRET_ACCESS_KEY absent"; fi
        echo "AWS_REGION=${AWS_REGION:-<unset>}"
      continue-on-error: true
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ vars.AWS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1
    - name: Generate file URLs
      if: always()
      id: fileurl
      env:
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        BASEPATH: ${{ steps.basepath.outputs.basepath }}
      run: |
        BASE_URL="https://${AWS_BUCKET}.s3.eu-central-1.amazonaws.com/artifacts/${BASEPATH}"
        echo "base-url=${BASE_URL}" >> $GITHUB_OUTPUT
        echo "Uploaded to: ${BASE_URL}"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG demo-video-mobile pre-sink"
        if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then echo "AWS_ACCESS_KEY_ID present len=${#AWS_ACCESS_KEY_ID}"; else echo "AWS_ACCESS_KEY_ID absent"; fi
        if [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then echo "AWS_SECRET_ACCESS_KEY present len=${#AWS_SECRET_ACCESS_KEY}"; else echo "AWS_SECRET_ACCESS_KEY absent"; fi
        if [ -n "${AWS_SESSION_TOKEN:-}" ]; then echo "AWS_SESSION_TOKEN present"; else echo "AWS_SESSION_TOKEN absent"; fi
        echo "AWS_REGION=${AWS_REGION:-<unset>}"
        if [ -f ./scripts/generateMarkdownSummaryMobile.js ]; then echo "sink script present"; else echo "sink script MISSING"; fi
        if command -v node >/dev/null 2>&1; then echo "node present: $(node --version 2>/dev/null || echo unknown)"; else echo "node MISSING"; fi
      continue-on-error: true
    - name: Generate markdown summary
      if: always()
      id: markdown
      env:
        BASE_URL: ${{ steps.fileurl.outputs.base-url }}
        TEST_STATUS: ${{ steps.generate_video.outcome }}
      run: |
        MARKDOWN=$(node ./scripts/generateMarkdownSummaryMobile.js "${BASE_URL}" "${TEST_STATUS}")
        echo "markdown<<EOF" >> $GITHUB_OUTPUT
        echo "$MARKDOWN" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    branches:
    - master
    - beta
    - release
